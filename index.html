<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KSND LAB — System Active</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Orbitron:wght@400;500;600&family=Rajdhani:wght@400;500;600&display=swap');

  :root{
    --bg:#050606;
    --ink:#eee8dc;
    --muted:rgba(225,220,207,.56);
    --gold:#e6b45b;
    --gold-soft:rgba(230,180,91,.20);
    --line:rgba(220,220,210,.10);
    --panel:rgba(8,10,10,.52);
    --cursor-x:50vw;
    --cursor-y:50vh;
  }

  *{box-sizing:border-box}

  html,
  body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:#030404;
  }

  body{
    color:var(--ink);
    font-family:Inter,system-ui,sans-serif;
    cursor:default;
  }

  button,
  a{font:inherit}

  .scene{
    position:relative;
    width:100%;
    height:100dvh;
    min-height:620px;
    overflow:hidden;
    isolation:isolate;
    background:
      radial-gradient(ellipse at 50% 58%, rgba(186,132,51,.08) 0%, rgba(20,22,22,.04) 27%, transparent 58%),
      radial-gradient(ellipse at 50% 100%, rgba(224,177,88,.08), transparent 44%),
      linear-gradient(180deg,#030404 0%,#070909 48%,#030404 100%);
  }
  /* ---------- Hangar architecture ---------- */
  .hangar{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:0;
  }

  .hangar-wall{
    position:absolute;
    inset:0;
    background:
      linear-gradient(90deg,
        rgba(255,255,255,.018) 0 1px,
        transparent 1px 14%,
        rgba(255,255,255,.018) 14% 14.08%,
        transparent 14.08% 31%,
        rgba(255,255,255,.014) 31% 31.06%,
        transparent 31.06% 69%,
        rgba(255,255,255,.014) 69% 69.06%,
        transparent 69.06% 86%,
        rgba(255,255,255,.018) 86% 86.08%,
        transparent 86.08%),
      linear-gradient(180deg,
        transparent 0 16%,
        rgba(255,255,255,.018) 16% 16.08%,
        transparent 16.08% 42%,
        rgba(255,255,255,.012) 42% 42.06%,
        transparent 42.06% 74%,
        rgba(255,255,255,.014) 74% 74.06%,
        transparent 74.06%);
    opacity:.62;
  }

  .hangar-wall::before,
  .hangar-wall::after{
    content:"";
    position:absolute;
    top:0;
    bottom:18%;
    width:17%;
    border-left:1px solid rgba(220,220,210,.07);
    border-right:1px solid rgba(220,220,210,.035);
    background:
      linear-gradient(180deg,rgba(255,255,255,.012),transparent 30%,rgba(255,255,255,.009));
  }

  .hangar-wall::before{left:5%}
  .hangar-wall::after{right:5%}

  .beam{
    position:absolute;
    background:linear-gradient(90deg,transparent,rgba(226,226,214,.12),transparent);
    opacity:.55;
    filter:blur(.2px);
  }

  .beam.top{
    top:9%;
    left:12%;
    width:76%;
    height:1px;
  }

  .beam.mid{
    top:28%;
    left:7%;
    width:86%;
    height:1px;
    opacity:.26;
  }

  .beam.side-left{
    top:0;
    left:8%;
    width:1px;
    height:74%;
    background:linear-gradient(180deg,transparent,rgba(226,226,214,.10),transparent);
  }

  .beam.side-right{
    top:0;
    right:8%;
    width:1px;
    height:74%;
    background:linear-gradient(180deg,transparent,rgba(226,226,214,.10),transparent);
  }

  .bay{
    position:absolute;
    top:13%;
    bottom:22%;
    width:18%;
    border:1px solid rgba(225,225,215,.045);
    background:
      linear-gradient(180deg,rgba(255,255,255,.018),transparent 18%,rgba(0,0,0,.12));
    box-shadow:inset 0 0 60px rgba(0,0,0,.32);
  }

  .bay.left{left:8%}
  .bay.right{right:8%}

  .bay::before,
  .bay::after{
    content:"";
    position:absolute;
    left:12%;
    right:12%;
    height:1px;
    background:rgba(226,226,214,.065);
  }

  .bay::before{top:22%}
  .bay::after{bottom:24%}

  .machine-silhouette{
    position:absolute;
    opacity:.16;
    filter:blur(.3px);
  }

  .machine-silhouette.left{
    left:2.5%;
    top:32%;
    width:11%;
    height:34%;
    border:1px solid rgba(221,221,211,.16);
    border-radius:5px 5px 2px 2px;
    box-shadow:
      0 0 0 10px rgba(0,0,0,.12),
      inset 0 0 40px rgba(255,255,255,.025);
  }

  .machine-silhouette.right{
    right:2.5%;
    top:36%;
    width:9%;
    height:28%;
    border:1px solid rgba(221,221,211,.12);
    box-shadow:inset 0 0 30px rgba(255,255,255,.018);
  }

  /* ---------- Floor ---------- */
  .floor{
    position:absolute;
    left:-12%;
    right:-12%;
    bottom:-5%;
    height:35%;
    transform:perspective(760px) rotateX(58deg);
    transform-origin:center top;
    background:
      linear-gradient(rgba(218,218,208,.065) 1px,transparent 1px),
      linear-gradient(90deg,rgba(218,218,208,.055) 1px,transparent 1px),
      radial-gradient(ellipse at 50% 0%,rgba(229,177,78,.12),transparent 38%),
      linear-gradient(180deg,#0b0d0d,#030404);
    background-size:78px 52px,78px 52px,100% 100%,100% 100%;
    box-shadow:0 -30px 80px rgba(0,0,0,.65);
    opacity:.48;
  }

  .floor::after{
    content:"";
    position:absolute;
    inset:-20%;
    background:radial-gradient(ellipse at 50% 0%,rgba(228,175,75,.18),transparent 32%);
    filter:blur(24px);
  }

  .floor-reflection{
    position:absolute;
    left:50%;
    bottom:9%;
    width:min(720px,68vw);
    height:150px;
    transform:translateX(-50%);
    background:radial-gradient(ellipse,rgba(224,171,73,.16),rgba(224,171,73,.04) 38%,transparent 72%);
    filter:blur(18px);
    opacity:.8;
  }

  /* ---------- Atmospheric depth ---------- */
  .haze{
    position:absolute;
    inset:0;
    background:
      radial-gradient(ellipse at 50% 54%,rgba(222,173,78,.045),transparent 38%),
      linear-gradient(90deg,rgba(0,0,0,.34),transparent 28%,transparent 72%,rgba(0,0,0,.34));
    mix-blend-mode:screen;
    opacity:.62;
  }

  .dust{
    position:absolute;
    inset:0;
    overflow:hidden;
  }

  .dust::before,
  .dust::after{
    content:"";
    position:absolute;
    inset:0;
    background-image:
      radial-gradient(circle at 14% 24%,rgba(235,197,126,.55) 0 1px,transparent 1.8px),
      radial-gradient(circle at 78% 32%,rgba(235,197,126,.35) 0 1px,transparent 1.7px),
      radial-gradient(circle at 31% 68%,rgba(235,197,126,.32) 0 1px,transparent 1.7px),
      radial-gradient(circle at 87% 76%,rgba(235,197,126,.4) 0 1px,transparent 1.7px);
    background-size:240px 210px,310px 260px,370px 320px,430px 350px;
    opacity:.14;
    animation:dustDrift 18s linear infinite;
  }

  .dust::after{
    transform:scale(1.4);
    opacity:.08;
    animation-duration:26s;
    animation-direction:reverse;
  }

  @keyframes dustDrift{
    from{transform:translate3d(0,0,0)}
    to{transform:translate3d(22px,-16px,0)}
  }

  /* ---------- Cursor light ---------- */
  .cursor-glow{
    position:fixed;
    z-index:20;
    left:var(--cursor-x);
    top:var(--cursor-y);
    width:260px;
    height:260px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    pointer-events:none;
    background:radial-gradient(circle,
      rgba(235,194,117,.075) 0%,
      rgba(235,194,117,.035) 24%,
      rgba(235,194,117,.012) 47%,
      transparent 72%);
    filter:blur(2px);
    mix-blend-mode:screen;
    transition:opacity .35s ease;
  }

  /* ---------- UI ---------- */
  .ui{
    position:relative;
    z-index:10;
    width:100%;
    height:100%;
  }

  .brand{
    position:absolute;
    top:6.5%;
    left:5.2%;
    letter-spacing:.52em;
    font-family:Orbitron,monospace;
    font-size:14px;
    font-weight:500;
  }

  .brand-sub{
    margin-top:10px;
    letter-spacing:.28em;
    font-family:Rajdhani,monospace;
    font-size:10px;
    color:rgba(238,232,220,.55);
  }

  .status{
    position:absolute;
    top:6.8%;
    right:5.2%;
    display:flex;
    align-items:center;
    gap:10px;
    font:500 10px Rajdhani,monospace;
    letter-spacing:.25em;
    color:rgba(238,232,220,.58);
  }

  .status-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#e9c36e;
    box-shadow:0 0 12px rgba(233,195,110,.75);
    animation:statusPulse 2.6s ease-in-out infinite;
  }

  @keyframes statusPulse{
    0%,100%{opacity:.58}
    50%{opacity:1}
  }

  .side-data{
    position:absolute;
    left:6.8%;
    top:42%;
    width:150px;
    font-family:Rajdhani,monospace;
    text-transform:uppercase;
  }

  .data-block{
    margin-bottom:28px;
  }

  .data-label{
    font-size:9px;
    letter-spacing:.24em;
    color:rgba(238,232,220,.42);
    margin-bottom:7px;
  }

  .data-value{
    font-size:13px;
    letter-spacing:.12em;
    color:rgba(238,232,220,.84);
  }

  .data-line{
    width:34px;
    height:1px;
    margin-top:9px;
    background:rgba(228,180,91,.35);
  }

  .right-data{
    position:absolute;
    right:6.8%;
    top:45%;
    width:180px;
    text-align:right;
    font-family:Rajdhani,monospace;
  }

  .mission{
    margin-top:26px;
    font-family:Orbitron,monospace;
    font-size:14px;
    line-height:1.65;
    letter-spacing:.08em;
  }

  .mission span{display:block}

  .infinity{
    color:#e9c36e;
    font-family:Georgia,serif;
    font-size:34px;
    line-height:1;
    margin-bottom:14px;
  }
  .hero{
    position:absolute;
    left:50%;
    top:50%;
    width:min(520px,44vw);
    height:min(86dvh,760px);
    max-height:calc(100dvh - 116px);
    transform:translate(-50%,-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:0;
  }

  .pod-stage{
    width:100%;
    flex:1 1 auto;
    min-height:0;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    filter:drop-shadow(0 36px 60px rgba(0,0,0,.82));
  }

  .pod-code{
    width:100%;
    height:100%;
    min-height:0;
    display:flex;
    align-items:flex-end;
    justify-content:center;
  }

  .pod-svg{
    width:auto;
    height:min(100%,68dvh);
    max-width:100%;
    display:block;
    overflow:visible;
    animation:podFloat 7s ease-in-out infinite;
    filter:
      drop-shadow(0 30px 45px rgba(0,0,0,.92))
      drop-shadow(0 0 28px rgba(212,162,78,.08));
  }

  @keyframes podFloat{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-3px)}
  }
  .cta{
    position:relative;
    z-index:3;
    flex:0 0 62px;
    width:min(430px,88%);
    height:62px;
    margin-top:10px;
    border:1px solid rgba(232,190,105,.72);
    background:linear-gradient(180deg,rgba(16,15,12,.78),rgba(5,6,6,.88));
    color:#eee8dc;
    font:500 12px Orbitron,monospace;
    letter-spacing:.28em;
    cursor:pointer;
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.025),
      0 0 28px rgba(226,177,80,.05);
    transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease;
  }

  .cta::before{
    content:"";
    position:absolute;
    inset:-1px;
    background:linear-gradient(90deg,transparent,rgba(234,190,102,.14),transparent);
    transform:translateX(-100%);
    transition:transform .6s ease;
    pointer-events:none;
  }

  .cta:hover{
    transform:translateY(-2px);
    border-color:rgba(248,211,133,.96);
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.04),
      0 0 32px rgba(226,177,80,.13);
  }

  .cta:hover::before{transform:translateX(100%)}

  .awaiting{
    flex:0 0 auto;
    margin-top:12px;
    color:rgba(238,232,220,.42);
    font:500 9px Rajdhani,monospace;
    letter-spacing:.36em;
  }

  .awaiting{
    margin-top:16px;
    color:rgba(238,232,220,.42);
    font:500 9px Rajdhani,monospace;
    letter-spacing:.36em;
  }

  .social{
    position:absolute;
    left:6%;
    bottom:5.2%;
    display:flex;
    gap:12px;
  }

  .social span{
    width:29px;
    height:29px;
    display:grid;
    place-items:center;
    border:1px solid rgba(231,226,213,.20);
    border-radius:50%;
    color:rgba(238,232,220,.58);
    font:500 9px Orbitron,monospace;
  }

  /* ---------- Existing token precision ---------- */
  .pod-svg text{user-select:none}
  [data-token]{
    transform-box:fill-box;
    transform-origin:center;
    transition:filter .35s ease,opacity .35s ease,transform .35s ease;
  }

  [data-token="top-ring"],
  [data-token="bottom-ring"]{
    animation:tokenRingBreath 3.2s ease-in-out infinite;
  }

  @keyframes tokenRingBreath{
    0%,100%{filter:brightness(.94)}
    50%{filter:brightness(1.08)}
  }

  [data-token="glass-envelope"]{
    pointer-events:none;
    mix-blend-mode:screen;
  }

  .logo-token{
    animation:logoFloat 4.8s ease-in-out infinite;
    transform-box:fill-box;
    transform-origin:center;
  }

  @keyframes logoFloat{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-2px)}
  }


  @media (max-height:700px) and (min-width:681px){
    .hero{
      height:calc(100dvh - 88px);
      max-height:calc(100dvh - 88px);
    }
    .pod-svg{height:min(61dvh,500px)}
    .cta{flex-basis:54px;height:54px;margin-top:6px}
    .awaiting{margin-top:7px}
    .side-data,.right-data{transform:scale(.92);transform-origin:top}
  }

  /* ---------- Responsive ---------- */
  @media (max-width:900px){
    .hero{width:min(560px,58vw);height:min(86dvh,700px)}
    .side-data,.right-data{opacity:.72}
    .bay{width:22%}
  }

  @media (max-width:680px){
    .scene{min-height:560px}
    .brand{top:5%;left:6%;font-size:12px}
    .brand-sub{font-size:8px}
    .status{top:5.3%;right:6%;font-size:8px}
    .side-data,.right-data{display:none}
    .hero{
      top:50%;
      width:min(480px,86vw);
      height:calc(100dvh - 96px);
      max-height:calc(100dvh - 96px);
    }
    .pod-code{max-width:440px}
    .pod-svg{height:min(62dvh,520px)}
    .cta{flex-basis:56px;height:56px;font-size:10px}
    .social{left:6%;bottom:4%}
    .cursor-glow{width:190px;height:190px}
  }

/* ================= PASS 14: CINEMATIC HANGAR DETAIL ================= */

.hangar-wall{
  background:
    linear-gradient(90deg,transparent 0 6%,rgba(255,255,255,.026) 6% 6.08%,transparent 6.08% 15%,rgba(255,255,255,.018) 15% 15.05%,transparent 15.05% 29%,rgba(255,255,255,.012) 29% 29.04%,transparent 29.04% 71%,rgba(255,255,255,.012) 71% 71.04%,transparent 71.04% 85%,rgba(255,255,255,.018) 85% 85.05%,transparent 85.05% 94%,rgba(255,255,255,.026) 94% 94.08%,transparent 94.08%),
    linear-gradient(180deg,transparent 0 11%,rgba(255,255,255,.02) 11% 11.05%,transparent 11.05% 29%,rgba(255,255,255,.016) 29% 29.05%,transparent 29.05% 52%,rgba(255,255,255,.012) 52% 52.04%,transparent 52.04% 76%,rgba(255,255,255,.016) 76% 76.05%,transparent 76.05%);
  opacity:.82;
}
.hangar-wall::before{
  content:"";
  position:absolute;
  inset:5% 4% 22%;
  border:1px solid rgba(228,228,216,.055);
  box-shadow:inset 0 0 80px rgba(0,0,0,.45);
}
.ceiling{
  position:absolute;top:-4%;left:12%;width:76%;height:28%;
  transform:perspective(700px) rotateX(54deg);transform-origin:50% 100%;
  background:repeating-linear-gradient(90deg,transparent 0 72px,rgba(230,230,220,.055) 72px 73px),
             repeating-linear-gradient(0deg,transparent 0 44px,rgba(230,230,220,.035) 44px 45px);
  border-bottom:1px solid rgba(225,225,215,.07);opacity:.55;
}
.hangar-beam{position:absolute;background:linear-gradient(90deg,transparent,rgba(226,226,214,.12),transparent)}
.hangar-beam.top{top:13%;left:7%;width:86%;height:1px}
.hangar-beam.mid{top:31%;left:6%;width:88%;height:1px;opacity:.45}
.hangar-beam.left{top:6%;left:8%;width:1px;height:72%;background:linear-gradient(180deg,transparent,rgba(226,226,214,.13),transparent)}
.hangar-beam.right{top:6%;right:8%;width:1px;height:72%;background:linear-gradient(180deg,transparent,rgba(226,226,214,.13),transparent)}

.bay{
  position:absolute;top:18%;bottom:22%;width:19%;
  border:1px solid rgba(225,225,215,.055);
  background:linear-gradient(180deg,rgba(255,255,255,.018),transparent 22%,rgba(0,0,0,.22)),
             repeating-linear-gradient(0deg,transparent 0 76px,rgba(225,225,215,.025) 76px 77px);
  box-shadow:inset 0 0 60px rgba(0,0,0,.45);
}
.bay.left{left:7%}.bay.right{right:7%}
.bay-light{position:absolute;width:54px;height:2px;background:#e9d8ad;box-shadow:0 0 12px rgba(235,210,145,.42);opacity:.55}
.bay.left .bay-light{left:18%;top:26%}.bay.right .bay-light{right:18%;top:34%}
.bay-light.two{top:61%!important;opacity:.25}

.rail{
  position:absolute;top:18%;bottom:20%;width:8px;
  border-left:1px solid rgba(224,224,214,.06);
  border-right:1px solid rgba(224,224,214,.03);
}
.rail.left{left:12%}.rail.right{right:12%}

.depth-machine{
  position:absolute;opacity:.19;border:1px solid rgba(225,225,215,.13);
  background:linear-gradient(180deg,rgba(255,255,255,.018),transparent);
  box-shadow:inset 0 0 34px rgba(0,0,0,.55);
}
.depth-machine.left{left:2.5%;top:36%;width:10%;height:27%}
.depth-machine.right{right:2.5%;top:31%;width:10%;height:31%}

.floor{
  background:
    linear-gradient(rgba(218,218,208,.075) 1px,transparent 1px),
    linear-gradient(90deg,rgba(218,218,208,.06) 1px,transparent 1px),
    radial-gradient(ellipse at 50% 0%,rgba(229,177,78,.18),transparent 38%),
    linear-gradient(180deg,#0a0c0c,#020303);
  background-size:76px 52px,76px 52px,100% 100%,100% 100%;
  opacity:.55;
}
.floor-pool{
  position:absolute;left:50%;bottom:15%;width:min(430px,42vw);height:80px;
  transform:translateX(-50%);
  background:radial-gradient(ellipse,rgba(235,188,95,.15),transparent 68%);
  filter:blur(12px);
}


.social button svg{width:18px;height:18px;position:relative;z-index:1;display:block}
[data-token="crown-leds"]{animation:crownLED 4.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes crownLED{0%,100%{opacity:.68}50%{opacity:1}}

/* ================= ITERATION 15 =================
   SOCIAL MODULE — integrated into the KSND system UI
*/
.social{
  align-items:center;
}

.social button{
  appearance:none;
  -webkit-appearance:none;
  background:rgba(5,6,6,.42) !important;
  color:rgba(235,207,153,.68) !important;
  border:1px solid rgba(215,166,77,.32) !important;
  border-radius:4px !important;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.012),
    0 0 0 rgba(229,177,82,0) !important;
}

.social button svg{
  width:17px;
  height:17px;
  display:block;
  background:transparent !important;
}

.social button:hover,
.social button:focus-visible{
  background:rgba(25,20,12,.62) !important;
  color:#f5d894 !important;
  border-color:rgba(241,195,103,.78) !important;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.025),
    0 0 18px rgba(229,177,82,.12) !important;
}

.social button::before{
  background:radial-gradient(circle at 50% 110%,rgba(232,180,88,.18),transparent 62%) !important;
}

.social button::after{
  opacity:.22 !important;
}

/* Pod base identity panel — treated as hardware, not a text card. */
.pod-identity-panel{
  font-family:Rajdhani,monospace;
  letter-spacing:.16em;
}
.pod-identity-panel .micro-label{
  font-size:7px;
  opacity:.48;
}
.pod-identity-panel .micro-value{
  font-size:9px;
  opacity:.76;
}

</style>

</head>

<body>
  <main class="scene" id="ksndScene">
    <div class="hangar" aria-hidden="true">
      <div class="hangar-wall"></div>
      <div class="ceiling"></div>
      <div class="hangar-beam top"></div>
      <div class="hangar-beam mid"></div>
      <div class="hangar-beam left"></div>
      <div class="hangar-beam right"></div>

  <script>
    const root = document.documentElement;
    const scene = document.getElementById('ksndScene');
    const glow = document.getElementById('cursorGlow');

    // Smooth cursor field. The glow is part of the KSND environment system.
    let targetX = window.innerWidth * 0.5;
    let targetY = window.innerHeight * 0.5;
    let currentX = targetX;
    let currentY = targetY;

    window.addEventListener('pointermove', (event) => {
      targetX = event.clientX;
      targetY = event.clientY;
    }, {passive:true});

    function renderCursor(){
      currentX += (targetX - currentX) * 0.075;
      currentY += (targetY - currentY) * 0.075;
      root.style.setProperty('--cursor-x', `${currentX}px`);
      root.style.setProperty('--cursor-y', `${currentY}px`);
      requestAnimationFrame(renderCursor);
    }
    renderCursor();

    document.getElementById('enterSystem').addEventListener('click', () => {
      document.body.dataset.systemEntered = 'true';
      window.location.href = 'explore.html';
    });
  </script>
